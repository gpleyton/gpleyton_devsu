# SonarCloud configuration.
# organization and projectKey must match the project in https://sonarcloud.io
sonar.organization=gpleyton
sonar.projectKey=gpleyton_devsu
sonar.projectName=demo-devops-nodejs

# Sources and exclusions
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,**/*.test.js,k8s/**,helm/**,terraform/**,docs/**,babel.config.*,.eslintrc.json

# Tests
sonar.tests=.
sonar.test.inclusions=**/*.test.js

# Coverage (lcov report generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
