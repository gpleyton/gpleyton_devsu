# Configuración de SonarCloud
# IMPORTANTE: estos dos valores deben coincidir EXACTAMENTE con tu proyecto en https://sonarcloud.io
#   - sonar.organization: la key de tu organización en SonarCloud
#   - sonar.projectKey:    la key del proyecto en SonarCloud
# Valores reales del proyecto en SonarCloud (organización gpleyton):
sonar.organization=gpleyton
sonar.projectKey=gpleyton_devsu
sonar.projectName=demo-devops-nodejs

# Código fuente y exclusiones
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,**/*.test.js,k8s/**,helm/**,terraform/**,docs/**,babel.config.*,.eslintrc.json

# Tests
sonar.tests=.
sonar.test.inclusions=**/*.test.js

# Cobertura (reporte lcov generado por Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
