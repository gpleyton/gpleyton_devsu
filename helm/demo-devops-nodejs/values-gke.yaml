# Values for the GKE deployment with nginx Ingress + TLS (Let's Encrypt via cert-manager).
# The host uses sslip.io pointing to the public IP of the ingress-nginx controller.
# Usage:
#   helm upgrade --install demo helm/demo-devops-nodejs -n devsu -f helm/demo-devops-nodejs/values-gke.yaml

image:
  repository: us-central1-docker.pkg.dev/devsu-demo-devops-gp/demo-devops-nodejs/demo-devops-nodejs
  tag: latest
  pullPolicy: Always

# Lower requests so it fits alongside ingress-nginx + cert-manager on a single e2-medium node.
# The app is lightweight and can burst CPU up to the limit.
resources:
  requests:
    cpu: "25m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Public access comes through the Ingress; the Service stays internal.
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: 34-135-97-73.sslip.io
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: demo-devops-tls
