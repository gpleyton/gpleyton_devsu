name: CI/CD

# Pipeline como código para la prueba técnica DevOps de Devsu.
# Etapas: Build -> Tests + Coverage -> Análisis estático (SonarCloud) ->
#         Vulnerability scan (Trivy) -> Build & Push imagen (GHCR) ->
#         Deploy a Kubernetes (cluster kind efímero) con validación.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita ejecuciones concurrentes redundantes sobre la misma referencia
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18.15.0"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build + Lint + Unit Tests + Code Coverage
  # ---------------------------------------------------------------------------
  build-test:
    name: Build, Lint y Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Análisis de estilo (ESLint)
        run: npm run lint

      - name: Tests unitarios con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) Análisis estático de código - SonarCloud
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: Análisis estático (SonarCloud)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para el blame/cobertura
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # 3) Build de imagen + escaneo de vulnerabilidades (Trivy) + push a GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: Build, Scan y Push de imagen
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write       # necesario para publicar en GHCR
      security-events: write # para subir resultados SARIF de Trivy
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tags de imagen
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen (carga local para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # informativo: no bloquea el pipeline por CVEs de la imagen base

      - name: Subir resultados de Trivy a Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Login a GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de la imagen (sha + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 4) Despliegue en Kubernetes (cluster kind efímero) + validación
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy a Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: devsu

      - name: Build de la imagen para el cluster
        run: docker build -t demo-devops-nodejs:ci .

      - name: Cargar la imagen en kind
        run: kind load docker-image demo-devops-nodejs:ci --name devsu

      - name: Desplegar con Helm
        run: |
          kubectl create namespace devsu --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install demo helm/demo-devops-nodejs \
            -n devsu \
            --set image.repository=demo-devops-nodejs \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set ingress.enabled=false \
            --set autoscaling.enabled=false \
            --set replicaCount=2 \
            --wait --timeout 180s

      - name: Verificar el despliegue
        run: |
          kubectl -n devsu rollout status deployment/demo-demo-devops-nodejs --timeout=120s
          kubectl -n devsu get pods -o wide
          echo "Réplicas listas:"
          kubectl -n devsu get deployment demo-demo-devops-nodejs -o jsonpath='{.status.readyReplicas}'; echo

      - name: Smoke test de los endpoints
        run: |
          kubectl -n devsu port-forward svc/demo-demo-devops-nodejs 18080:80 &
          PF=$!
          sleep 5
          echo "Health:"; curl -sf http://localhost:18080/api/health | tee /dev/stderr; echo
          echo "Crear usuario:"; curl -sf -X POST http://localhost:18080/api/users \
            -H 'Content-Type: application/json' -d '{"dni":"1234567890","name":"CI User"}' | tee /dev/stderr; echo
          echo "Listar usuarios:"; curl -sf http://localhost:18080/api/users | tee /dev/stderr; echo
          kill $PF || true
