name: Application CI/CD

# Application pipeline: Build -> Tests + Coverage -> Static analysis (SonarCloud) ->
# Vulnerability scan (Trivy) -> Build & Push image (GHCR) ->
# Deploy to Kubernetes (ephemeral kind cluster) with smoke test.
# Infrastructure (Terraform) lives in a separate workflow: infrastructure.yml

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18.15.0"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build + Lint + Unit Tests + Code Coverage
  # ---------------------------------------------------------------------------
  build-test:
    name: Build, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm ci)
        # Ignore lifecycle scripts for supply-chain safety, then rebuild the
        # native module we explicitly trust (sqlite3).
        run: npm ci --ignore-scripts && npm rebuild sqlite3

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) Static code analysis - SonarCloud
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: Static analysis (SonarCloud)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # SonarCloud needs full history for blame/coverage
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # 3) Image build + vulnerability scan (Trivy) + push to GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: Build, Scan & Push image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write        # required to publish to GHCR
      security-events: write # required to upload Trivy SARIF results
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Define image tags
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (load locally to scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # informative: do not fail the pipeline on base image CVEs

      - name: Upload Trivy results to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (sha + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 4) Application deployment to Kubernetes (ephemeral kind cluster) + smoke test
  # ---------------------------------------------------------------------------
  deploy-app:
    name: Deploy application (Kubernetes)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: devsu

      - name: Build image for the cluster
        run: docker build -t demo-devops-nodejs:ci .

      - name: Load image into kind
        run: kind load docker-image demo-devops-nodejs:ci --name devsu

      - name: Deploy with Helm
        run: |
          kubectl create namespace devsu --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install demo helm/demo-devops-nodejs \
            -n devsu \
            --set image.repository=demo-devops-nodejs \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set ingress.enabled=false \
            --set autoscaling.enabled=false \
            --set replicaCount=2 \
            --wait --timeout 180s

      - name: Verify deployment
        run: |
          kubectl -n devsu rollout status deployment/demo-demo-devops-nodejs --timeout=120s
          kubectl -n devsu get pods -o wide
          echo "Ready replicas:"
          kubectl -n devsu get deployment demo-demo-devops-nodejs -o jsonpath='{.status.readyReplicas}'; echo

      - name: Smoke test the endpoints
        run: |
          kubectl -n devsu port-forward svc/demo-demo-devops-nodejs 18080:80 &
          PF=$!
          sleep 5
          echo "Health:"; curl -sf http://localhost:18080/api/health | tee /dev/stderr; echo
          echo "Create user:"; curl -sf -X POST http://localhost:18080/api/users \
            -H 'Content-Type: application/json' -d '{"dni":"1234567890","name":"CI User"}' | tee /dev/stderr; echo
          echo "List users:"; curl -sf http://localhost:18080/api/users | tee /dev/stderr; echo
          kill $PF || true
