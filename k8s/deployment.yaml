apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-devops-nodejs
  namespace: devsu
  labels:
    app.kubernetes.io/name: demo-devops-nodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-devops-nodejs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-devops-nodejs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/gpleyton/gpleyton_devsu:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: demo-devops-nodejs-config
            - secretRef:
                name: demo-devops-nodejs-secret
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # SQLite necesita escribir su fichero; con readOnlyRootFilesystem
            # montamos un volumen efímero dedicado para los datos.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
