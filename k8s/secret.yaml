apiVersion: v1
kind: Secret
metadata:
  name: demo-devops-nodejs-secret
  namespace: devsu
  labels:
    app.kubernetes.io/name: demo-devops-nodejs
type: Opaque
# stringData is used for readability. In a real environment these values
# should be managed by a secrets manager (Sealed Secrets, Vault,
# GCP Secret Manager, etc.) and NEVER committed to the repository.
stringData:
  DATABASE_USER: "user"
  DATABASE_PASSWORD: "password"
