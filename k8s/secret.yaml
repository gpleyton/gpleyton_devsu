apiVersion: v1
kind: Secret
metadata:
  name: demo-devops-nodejs-secret
  namespace: devsu
  labels:
    app.kubernetes.io/name: demo-devops-nodejs
type: Opaque
# Se usa stringData para legibilidad. En un entorno real estos valores
# deberían gestionarse con un gestor de secretos (Sealed Secrets, Vault,
# GCP Secret Manager, etc.) y NUNCA versionarse en el repositorio.
stringData:
  DATABASE_USER: "user"
  DATABASE_PASSWORD: "password"
